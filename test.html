<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skeuomorphic Calculator</title>
    <style>
        :root {
            --bg-color: #e0e5ec;
            --calc-body: #3a3d42;
            --screen-bg: #a7b3a3;
            /* Classic LCD color */
            --btn-grey: #4a4e54;
            --btn-dark: #2d3035;
            --btn-accent: #ff9f0a;
            --text-light: #ffffff;
            --shadow-dark: #1a1c1f;
            --shadow-light: #5a5e64;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* The Calculator Case */
        .calculator {
            background: var(--calc-body);
            padding: 25px;
            border-radius: 30px;
            box-shadow:
                20px 20px 60px #bebebe,
                -20px -20px 60px #ffffff,
                inset 2px 2px 5px rgba(255, 255, 255, 0.1),
                inset -2px -2px 5px rgba(0, 0, 0, 0.5);
            width: 320px;
            border: 1px solid #222;
        }

        /* The LCD Screen */
        .display-container {
            background-color: var(--screen-bg);
            margin-bottom: 25px;
            padding: 15px;
            border-radius: 10px;
            box-shadow:
                inset 4px 4px 10px rgba(0, 0, 0, 0.5),
                inset -2px -2px 5px rgba(255, 255, 255, 0.3);
            border: 4px solid var(--btn-dark);
            text-align: right;
            min-height: 60px;
        }

        #display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2rem;
            font-weight: bold;
            color: #333;
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Buttons Grid */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .btn {
            height: 60px;
            width: 60px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-light);
            transition: all 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;

            /* Skeuomorphic Depth */
            background: linear-gradient(145deg, #4e5258, #33373d);
            box-shadow:
                4px 4px 8px var(--shadow-dark),
                -1px -1px 2px var(--shadow-light);
        }

        /* Press effect: The button "sinks" into the calculator */
        .btn:active {
            box-shadow:
                inset 2px 2px 5px var(--shadow-dark),
                inset -1px -1px 2px var(--shadow-light);
            transform: scale(0.96);
        }

        /* Special Button Colors */
        .btn-operator {
            background: linear-gradient(145deg, #ffb340, #e67e00);
            color: white;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.3);
        }

        .btn-special {
            background: linear-gradient(145deg, #6d7278, #4a4e54);
        }

        .btn-zero {
            grid-column: span 2;
            width: 135px;
        }

        .btn-equal {
            background: linear-gradient(145deg, #4cd964, #28a745);
        }
    </style>
</head>

<body>

    <div class="calculator">
        <div class="display-container">
            <div id="display">0</div>
        </div>

        <div class="buttons">
            <!-- Row 1 -->
            <button class="btn btn-special" onclick="clearDisplay()">C</button>
            <button class="btn btn-special" onclick="appendCharacter('/')">÷</button>
            <button class="btn btn-special" onclick="appendCharacter('*')">×</button>
            <button class="btn btn-operator" onclick="deleteLast()">⌫</button>

            <!-- Row 2 -->
            <button class="btn" onclick="appendCharacter('7')">7</button>
            <button class="btn" onclick="appendCharacter('8')">8</button>
            <button class="btn" onclick="appendCharacter('9')">9</button>
            <button class="btn btn-operator" onclick="appendCharacter('-')">−</button>

            <!-- Row 3 -->
            <button class="btn" onclick="appendCharacter('4')">4</button>
            <button class="btn" onclick="appendCharacter('5')">5</button>
            <button class="btn" onclick="appendCharacter('6')">6</button>
            <button class="btn btn-operator" onclick="appendCharacter('+')">+</button>

            <!-- Row 4 -->
            <button class="btn" onclick="appendCharacter('1')">1</button>
            <button class="btn" onclick="appendCharacter('2')">2</button>
            <button class="btn" onclick="appendCharacter('3')">3</button>
            <button class="btn btn-equal" onclick="calculate()">=</button>

            <!-- Row 5 -->
            <button class="btn btn-zero" onclick="appendCharacter('0')">0</button>
            <button class="btn" onclick="appendCharacter('.')">.</button>
            <button class="btn btn-operator" onclick="calculate()">↵</button>
        </div>
    </div>

    <script>
        const displayElement = document.getElementById('display');
        let currentInput = '0';

        function updateDisplay() {
            displayElement.innerText = currentInput;
        }

        function appendCharacter(char) {
            if (currentInput === '0' && char !== '.') {
                currentInput = char;
            } else {
                currentInput += char;
            }
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = '0';
            updateDisplay();
        }

        function deleteLast() {
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        function calculate() {
            try {
                // Using Function instead of eval for slightly better security/performance
                const result = new Function('return ' + currentInput)();
                currentInput = Number.isInteger(result) ? result.toString() : result.toFixed(4).replace(/\.?0+$/, "");
            } catch (error) {
                currentInput = "Error";
                setTimeout(clearDisplay, 1500);
            }
            updateDisplay();
        }
    </script>
</body>

</html>
